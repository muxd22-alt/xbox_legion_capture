# lsfg-vk profile for Xbox capture -> 1080p120 monitor
# Save as ~/.config/lsfg-vk/conf.toml
#
# 30 fps capture x 4 = 120 fps output.
# The display MUST be running at 1920x1080@120 for this to land on 120.
#
# If your lsfg-vk build rejects [[profile]], open the GUI once
# (lsfg-vk-ui / "Configure lsfg-vk"), let it write the file, then copy
# these values into the section it created.

version = 2

[global]
allow_fp16 = true

[[profile]]
name = "mpv 4x 1080p120"
active_in = "mpv"
multiplier = 4
flow_scale = 0.5
performance_mode = true
pacing_mode = "vsync"

# Tuning:
#   stable 120?        raise flow_scale to 0.65, then 0.75
#   not stable?        keep 0.5 + performance_mode
#   still not stable?  multiplier = 3 (90 fps, use VRR if available)
#   last resort        multiplier = 2 (60 fps, set monitor to 60 Hz)
#
# Validate with:
#   lsfg-vk-cli validate
#   lsfg-vk-cli validate -p
#   lsfg-vk-cli healthcheck
#
# If `validate` reports "Unknown key" for pacing_mode, use `pacing` instead.
# Pacing mode "vsync" requires Vsync; lsfg-vk forces it for you.
