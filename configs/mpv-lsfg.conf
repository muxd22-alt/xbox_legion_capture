# mpv config for Xbox capture -> 1080p120 monitor (Path C)
# Save as ~/.config/mpv/mpv.conf
#
# Assumes:
#   - external monitor set to 1920x1080@120, SDR, 100% scaling
#   - lsfg-vk profile "mpv" with multiplier 4 (30 x 4 = 120)
#   - capture card delivering 1920x1080 @ 30 fps
#
# Launch:
#   mpv av://v4l2:/dev/video0 --fs \
#     --demuxer-lavf-o=video_size=1920x1080,framerate=30,input_format=mjpeg

# --- renderer ---------------------------------------------------------------
vo=gpu-next
gpu-api=vulkan
hwdec=vaapi

# --- latency / sync ---------------------------------------------------------
# untimed + desync stop mpv from resampling 30 -> 120 itself.
# If mpv duplicates to 120 first, lsfg-vk sees 120 and multiplies that.
profile=low-latency
untimed=yes
video-sync=desync
interpolation=no
tscale=no

# --- scaling ----------------------------------------------------------------
# 1080p source -> 1080p monitor: 1:1, no scaling.
scale=bilinear
dscale=bilinear
cscale=bilinear

# --- sharpening / post-processing (optional, costs GPU headroom) ------------
# Add these only after 4x/120 is stable. See docs/07-post-processing.md.
#
# Do NOT install OptiScaler / ReShade / DLSS Enabler. They hook a game's
# renderer; mpv playing a capture card has no game to hook.
#
# CAS 1.2 (recommended): save CAS.glsl to ~/.config/mpv/shaders/
#   https://gist.github.com/agyild/bbb4e58298b2f86aa24da3032a0d2ee6
# glsl-shaders=~~/shaders/CAS.glsl
#
# FSR 1: only useful if you capture below 1080p (1600x900 / 1280x720).
#   https://gist.github.com/agyild/82219c545228d70c5604f865ce0b0ce5
# glsl-shaders=~~/shaders/FSR.glsl
#
# MJPEG bands in skies; deband is nearly free.
# deband=yes
# deband-iterations=2
# deband-threshold=35
#
# Colour, no shader needed: contrast=0, saturation=1.05, gamma=0
#
# Never stack vkBasalt/ReShade as a Vulkan layer next to lsfg-vk.

# --- audio ------------------------------------------------------------------
# mpv's v4l2 input is video only. The card's audio is a separate PipeWire
# source. For local sound, link it to your speakers:
#   pw-link <card-source> <speaker-sink>
# If you insist on mpv audio, libavdevice can open ALSA directly:
# audio-device=alsa/<card-hw-name>
# audio-sync=yes

# --- UI ---------------------------------------------------------------------
fs=yes
osc=no
osd-level=0
